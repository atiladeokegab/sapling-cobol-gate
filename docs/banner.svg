<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Sapling COBOL change gate. Verify what the AI says it changed. A COBOL diff where an AI doubled the bonus, Banyan Sapling scoring it violation 0.92, and a red BLOCK stamp.">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="2" height="2" fill="#F4F4F5" opacity=".07"/></pattern>
    <radialGradient id="gg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00D46A" stop-opacity=".22"/><stop offset="1" stop-color="#00D46A" stop-opacity="0"/></radialGradient>
    <radialGradient id="rg" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F87171" stop-opacity=".28"/><stop offset="1" stop-color="#F87171" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x2="1"><stop offset="0" stop-color="#09090B"/><stop offset="1" stop-color="#09090B" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1280" height="400" fill="#09090B"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <circle cx="230" cy="190" r="300" fill="url(#gg)"/>
  <circle cx="1060" cy="250" r="230" fill="url(#rg)"/>

  <!-- left: wordmark and tagline -->
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="104" font-size="20" font-weight="600" fill="#00D46A" letter-spacing="3">REFINERY × BANYAN SAPLING</text>
    <text x="70" y="178" font-size="60" font-weight="700" fill="#F4F4F5" letter-spacing="-1.5">Sapling COBOL</text>
    <text x="70" y="246" font-size="60" font-weight="700" fill="#F4F4F5" letter-spacing="-1.5">change gate<tspan fill="#00D46A">.</tspan></text>
    <text x="72" y="300" font-size="26" font-weight="500" fill="#A1A1AA">Verify what the AI says it changed.</text>
    <g transform="translate(72 330)">
      <rect width="148" height="34" rx="17" fill="none" stroke="#27272A" stroke-width="2"/>
      <circle cx="20" cy="17" r="5" fill="#00D46A"/>
      <text x="34" y="23" font-size="16" font-weight="600" fill="#F4F4F5">live demo</text>
      <rect x="160" width="236" height="34" rx="17" fill="none" stroke="#27272A" stroke-width="2"/>
      <text x="180" y="23" font-size="16" font-weight="600" fill="#A1A1AA">policy · evidence · claim</text>
    </g>
  </g>

  <!-- right: the diff card -->
  <g transform="translate(640 70)">
    <rect width="580" height="270" rx="18" fill="#111113" stroke="#27272A" stroke-width="2"/>
    <circle cx="28" cy="32" r="6" fill="#00D46A"/>
    <text x="44" y="38" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#A1A1AA">AI: "Refactor for readability. No change to pay."</text>
    <g font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="17">
      <rect x="16" y="58" width="548" height="32" rx="6" fill="#3F1212" opacity=".7"/>
      <text x="28" y="80" fill="#FCA5A5">- WS-BASE-PAY + WS-BONUS - WS-DEDUCTION</text>
      <rect x="16" y="96" width="548" height="32" rx="6" fill="#14532D" opacity=".7"/>
      <text x="28" y="118" fill="#86EFAC">+ WS-BASE-PAY + WS-BONUS <tspan fill="#FCD34D">* 2</tspan> - WS-DEDUCTION</text>
      <rect x="282" y="98" width="46" height="28" rx="6" fill="none" stroke="#FCD34D" stroke-width="2.5"/>
    </g>
    <g font-family="Inter, Helvetica, Arial, sans-serif">
      <text x="28" y="172" font-size="15" font-weight="600" fill="#A1A1AA" letter-spacing="1.5">SAPLING</text>
      <text x="28" y="204" font-size="18" font-weight="600" fill="#F4F4F5">violation</text>
      <rect x="130" y="188" width="150" height="22" rx="6" fill="#18181B"/>
      <rect x="130" y="188" width="138" height="22" rx="6" fill="#F87171"/>
      <text x="292" y="205" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="17" font-weight="700" fill="#F4F4F5">0.92</text>
      <text x="28" y="240" font-size="18" font-weight="500" fill="#A1A1AA">supported</text>
      <rect x="130" y="224" width="150" height="22" rx="6" fill="#18181B"/>
      <rect x="130" y="224" width="5" height="22" rx="2" fill="#00D46A"/>
      <text x="292" y="241" font-family="'DejaVu Sans Mono', Menlo, monospace" font-size="17" fill="#A1A1AA">0.02</text>
    </g>
  </g>
  <!-- the stamp -->
  <g transform="translate(1112 296) rotate(-7)" font-family="Inter, Helvetica, Arial, sans-serif">
    <rect x="-112" y="-40" width="224" height="80" rx="12" fill="#3F1212" fill-opacity=".85" stroke="#F87171" stroke-width="5"/>
    <text x="0" y="20" text-anchor="middle" font-size="54" font-weight="800" fill="#F87171" letter-spacing="2">BLOCK</text>
  </g>
</svg>
